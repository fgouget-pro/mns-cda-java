<html>
<head>
    <title th:text="${task.title}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container-fluid">
    <a href="/tasks">Retour</a>
    <form method="POST">ID: <span th:text="${task.id}"></span><br>
        Created By: <a th:href="@{'users'(id=${task.creator.id})}" th:text="|${task.creator.firstName} ${task.creator.lastName}|"></a><br>
        <label class="form-check-label">Terminee&nbsp; </label>
        <input class="form-check-input" type="checkbox"  name="done" th:checked="${task.done}"><br>
        <label class="form-label">Title </label>
        <input class="form-control" type="text" name="title" th:attr="value=${task.title}"><br>
        <label class="form-label">Description </label>
        <input class="form-control" type="text" name="description"
               th:attr="value=${task.description}">
        <br>
        <button class="btn btn-success">OK</button>
    </form>
</div>


</html>
