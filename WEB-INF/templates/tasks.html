<html>
<head>
    <title>Liste des tâches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>
<div class="container-fluid">
    <h1>Liste des taches:</h1>
    <a href="/tasks?done=true" th:if="done != 'true'">Tâches terminées</a>&nbsp;
    <a href="/tasks?done=false" th:if="done != 'false'">Tâches en cours</a>&nbsp;
    <a href="/tasks?done=all" th:if="done != 'all'">Toutes les tâches</a>
    <br>
    <ul>
        <li th:each="task: ${tasks}">
            <a th:href="@{'tasks'(id=${task.id})}" th:text="|${task.id} ${task.title}|"></a>
        </li>
    </ul>

</div>
</body>
</html>
